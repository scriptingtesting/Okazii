<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator Rețineri + Calculatoare</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; }
    h2 { color: #333; }
    label { display: block; margin-top: 20px; }
    input { padding: 8px; width: 100%; max-width: 300px; margin-top: 5px; }
    button { margin-top: 10px; margin-right: 5px; padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    .reset { background: #dc3545; }
    .reset:hover { background: #a71d2a; }
    .result { margin-top: 10px; font-weight: bold; }
    hr { margin: 40px 0; }
  </style>
</head>
<body>

  <h2>Calculator Rețineri</h2>

  <label>Suma vânzare (X):</label>
  <input type="number" id="vanzare">
  <button onclick="calculeazaFinal()">Calculează</button>
  <button class="reset" onclick="resetRetineri()">Reset</button>
  <div class="result" id="rezultatFinal"></div>

  <label>Suma netă dorită:</label>
  <input type="number" id="net">
  <button onclick="calculeazaInvers()">Calculează</button>
  <button class="reset" onclick="resetRetineri()">Reset</button>
  <div class="result" id="rezultatInvers"></div>

  <hr>

  <h2>🧮 Calculator Simplu</h2>

  <input type="text" id="expr">
  <button onclick="calculeazaExpresie()">Calculează</button>
  <button class="reset" onclick="resetSimplu()">Reset</button>
  <div class="result" id="rezultatExpresie"></div>

  <hr>

  <h2>📊 Calculator Procente</h2>

  <label>% din număr</label>
  <input type="number" id="proc1">
  <input type="number" id="nr1">
  <button onclick="calcProcDin()">Calculează</button>
  <button class="reset" onclick="resetProc1()">Reset</button>
  <div class="result" id="rezProc1"></div>

  <label>X din Y (%)</label>
  <input type="number" id="nr2">
  <input type="number" id="nr3">
  <button onclick="calcProcCat()">Calculează</button>
  <button class="reset" onclick="resetProc2()">Reset</button>
  <div class="result" id="rezProc2"></div>

  <label>Adaugă / Scade %</label>
  <input type="number" id="nr4">
  <input type="number" id="proc2">
  <button onclick="adaugaProc()">Adaugă</button>
  <button onclick="scadeProc()">Scade</button>
  <button class="reset" onclick="resetProc3()">Reset</button>
  <div class="result" id="rezProc3"></div>

  <script>
    function calculeazaFinal() {
      const x = parseFloat(vanzare.value);
      if (isNaN(x)) return;
      rezultatFinal.innerText = (0.9032 * x).toFixed(2) + " lei";
    }

    function calculeazaInvers() {
      const netVal = parseFloat(net.value);
      if (isNaN(netVal)) return;
      rezultatInvers.innerText = (netVal / 0.9032).toFixed(2) + " lei";
    }

    function calculeazaExpresie() {
      let expr = document.getElementById("expr").value.replace(/,/g, ".");
      if (!/^[0-9+\-*/(). ]+$/.test(expr)) {
        rezultatExpresie.innerText = "Invalid!";
        return;
      }
      try {
        rezultatExpresie.innerText = Function('"use strict";return ('+expr+')')();
      } catch {
        rezultatExpresie.innerText = "Eroare!";
      }
    }

    function calcProcDin() {
      const p = parseFloat(proc1.value);
      const n = parseFloat(nr1.value);
      if (isNaN(p)||isNaN(n)) return;
      rezProc1.innerText = (p/100*n).toFixed(2);
    }

    function calcProcCat() {
      const x = parseFloat(nr2.value);
      const y = parseFloat(nr3.value);
      if (isNaN(x)||isNaN(y)||y===0) return;
      rezProc2.innerText = ((x/y)*100).toFixed(2)+"%";
    }

    function adaugaProc() {
      const n = parseFloat(nr4.value);
      const p = parseFloat(proc2.value);
      if (isNaN(n)||isNaN(p)) return;
      rezProc3.innerText = (n+n*p/100).toFixed(2);
    }

    function scadeProc() {
      const n = parseFloat(nr4.value);
      const p = parseFloat(proc2.value);
      if (isNaN(n)||isNaN(p)) return;
      rezProc3.innerText = (n-n*p/100).toFixed(2);
    }

    // 🔴 RESET FUNCTIONS
    function resetRetineri() {
      vanzare.value = "";
      net.value = "";
      rezultatFinal.innerText = "";
      rezultatInvers.innerText = "";
    }

    function resetSimplu() {
      expr.value = "";
      rezultatExpresie.innerText = "";
    }

    function resetProc1() {
      proc1.value = "";
      nr1.value = "";
      rezProc1.innerText = "";
    }

    function resetProc2() {
      nr2.value = "";
      nr3.value = "";
      rezProc2.innerText = "";
    }

    function resetProc3() {
      nr4.value = "";
      proc2.value = "";
      rezProc3.innerText = "";
    }
  </script>

</body>
</html>
